<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VeriCart — Management Verification Queue</title><link rel="stylesheet" href="/static/css/style.css"><style>
body{min-height:100vh}.management{max-width:1250px;margin:0 auto;padding:28px}.mg-header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}.mg-title{font-size:28px;font-weight:800}.mg-sub{color:var(--text-secondary);font-size:13px;margin-top:6px}.mg-actions{display:flex;gap:10px}.mg-btn{border:1px solid var(--border);background:var(--surface);color:var(--text-primary);padding:10px 14px;border-radius:10px;cursor:pointer}.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}.case{background:rgba(16,22,40,.82);border:1px solid var(--border);border-radius:16px;padding:18px;box-shadow:var(--shadow)}.case h3{margin:0 0 8px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700;background:rgba(245,158,11,.12);color:#fbbf24}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0;font-size:12px}.grid span:nth-child(odd){color:var(--text-muted)}.evidence{font-size:11px;color:var(--text-secondary);word-break:break-word}.case-actions{display:flex;gap:8px;margin-top:15px}.approve,.reject{flex:1;border:0;padding:9px;border-radius:9px;cursor:pointer;font-weight:700}.approve{background:#059669;color:white}.reject{background:#b91c1c;color:white}.empty{text-align:center;color:var(--text-muted);padding:60px}.back{color:var(--cyan);text-decoration:none}
</style></head><body><div class="management"><div class="mg-header"><div><a class="back" href="/">← Back to VeriCart</a><div class="mg-title">Human Verification Queue</div><div class="mg-sub">Cases that the AI could not safely verify automatically.</div></div><div class="mg-actions"><button class="mg-btn" onclick="loadCases()">↻ Refresh</button></div></div><div id="cases" class="cases"></div></div>
<script>
async function loadCases(){const box=document.getElementById('cases');box.innerHTML='<div class="empty">Loading cases…</div>';const r=await fetch('/api/cases');const d=await r.json();const cases=d.cases||[];if(!cases.length){box.innerHTML='<div class="empty">No pending human-verification cases.</div>';return}box.innerHTML=cases.map(c=>{const a=c.analysis||{};return `<article class="case"><span class="pill">${esc(c.status||'PENDING')}</span><h3>${esc(c.order?.product||c.order_id)}</h3><div class="grid"><span>Case</span><b>${esc(c.case_id)}</b><span>Order</span><b>${esc(c.order_id)}</b><span>Grievance</span><b>${esc(c.grievance)}</b><span>Detected</span><b>${esc(a.detected_product||'Unknown')}</b><span>Product confidence</span><b>${Math.round((a.product_confidence||0)*100)}%</b><span>Damage confidence</span><b>${Math.round((a.damage_confidence||0)*100)}%</b><span>Package ID</span><b>${a.package_order_match?'Verified':'Not verified'}</b></div><div class="evidence">${esc(a.reason||'Human review requested.')}<br><br>Evidence file: ${esc(c.evidence_file||'')}</div>${c.status==='PENDING'?`<div class="case-actions"><button class="approve" onclick="decide('${c.case_id}','APPROVED')">Approve return</button><button class="reject" onclick="decide('${c.case_id}','REJECTED')">Reject</button></div>`:''}</article>`}).join('')}
async function decide(id,status){await fetch('/api/cases/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,note:'Reviewed by management.'})});loadCases()}
function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML}loadCases();
</script></body></html>
